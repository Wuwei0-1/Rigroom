# Rigroom render server: renders a job with Blender Cycles on GitHub's machines.
#
# Jobs live in the private studio repository (jobs/<id>/scene.glb and job.json). This public
# repository only runs the renderer: it reads the studio with the STUDIO_TOKEN secret, keeps
# frames encrypted while they move between machines, and writes the result to out/<id>/ in the
# studio. Nothing from the studio is stored here.
#
# The self-test (store: public) renders a mannequin-only job from this repository's renders branch.
name: Render

on:
  workflow_dispatch:
    inputs:
      job:
        description: Job id (a folder under jobs/)
        required: true
      store:
        description: Where the job lives
        type: choice
        options: [studio, public]
        default: studio
  # a change to the render code re-renders the self-test job
  push:
    branches: [main]
    paths:
      - 'render/**'
      - '.github/workflows/render.yml'

permissions:
  contents: write

env:
  JOB: ${{ inputs.job || 'selftest' }}
  STORE: ${{ inputs.store || 'public' }}
  STUDIO_REPO: ${{ vars.STUDIO_REPO || format('{0}-studio', github.repository) }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - name: Check the job
        env:
          HAS_TOKEN: ${{ secrets.STUDIO_TOKEN != '' }}
        run: |
          [[ "$JOB" =~ ^[A-Za-z0-9_-]{1,80}$ ]] || { echo "Bad job id"; exit 1; }
          if [ "$STORE" = studio ] && [ "$HAS_TOKEN" != true ]; then echo "The STUDIO_TOKEN secret is missing"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STORE == 'studio' && env.STUDIO_REPO || github.repository }}
          ref: ${{ env.STORE == 'studio' && 'main' || 'renders' }}
          token: ${{ env.STORE == 'studio' && secrets.STUDIO_TOKEN || github.token }}
          path: data
          filter: blob:none
          sparse-checkout: jobs/${{ env.JOB }}/
          sparse-checkout-cone-mode: false
      - name: Build the scene
        run: |
          J="data/jobs/$JOB"
          if [ -f "$J/scene.glb" ]; then echo "The job brought its own scene.glb"; exit 0; fi
          # a job can render a Blender file kept in the studio, as it was made (its own engine, sets and animation)
          BLEND=$(python3 -c "import json;j=json.load(open('$J/job.json'));print(j.get('blend','') if j.get('source')=='blend' else '')")
          if [ -n "$BLEND" ]; then
            [[ "$BLEND" =~ ^[A-Za-z0-9_./-]{1,120}\.blend$ && "$BLEND" != *..* ]] || { echo "Bad Blender file path"; exit 1; }
            git -C data sparse-checkout add "$BLEND" && cp "data/$BLEND" "$J/scene.blend" && ls -la "$J/scene.blend"; exit 0
          fi
          # fetch only the people and models this scene uses
          git -C data sparse-checkout add models/index.json
          for h in $(python3 -c "import json;j=json.load(open('$J/job.json'));x=json.load(open('data/models/index.json'));print(' '.join(sorted({(x.get(h) or {}).get('replacedBy') or h for h in {(e.get('params') or {}).get(k) for e in j['scene'].get('ents',[]) for k in ('look','model')} - {None}})))"); do
            [[ "$h" =~ ^[a-f0-9]{8,64}$ ]] && git -C data sparse-checkout add "models/$h.glb"
          done
          for img in $(python3 -c "import json;j=json.load(open('$J/job.json'));print(' '.join(sorted({(e.get('params') or {}).get('image') for e in j['scene'].get('ents',[]) if (e.get('params') or {}).get('mat')=='screen'} - {None})))"); do
            [[ "$img" =~ ^[A-Za-z0-9_./-]{1,80}$ && "$img" != *..* ]] && git -C data sparse-checkout add "$img"
          done
          npm install --no-save --silent playwright-core@1.63.0 > /dev/null
          node app/render/export_scene.mjs app data "$J"
      - name: Pack the job
        env:
          KEY: ${{ secrets.STUDIO_TOKEN }}
        run: |
          # the scene (built here, or a Blender file the job brought) and any pictures shown on screens
          (cd "data/jobs/$JOB" && tar -cf "$GITHUB_WORKSPACE/job.tar" job.json $(ls -d scene.glb scene.blend images 2>/dev/null))
          tar -tf job.tar
          if [ "$STORE" = studio ]; then openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -in job.tar -out job.pack; else mv job.tar job.pack; fi
      - uses: actions/upload-artifact@v4
        with:
          name: job-${{ env.JOB }}
          path: job.pack
          retention-days: 1
      - id: plan
        run: echo "chunks=$(python3 app/render/plan.py "data/jobs/$JOB/job.json")" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/download-artifact@v4
        with:
          name: job-${{ env.JOB }}
      - name: Unpack the job
        env:
          KEY: ${{ secrets.STUDIO_TOKEN }}
        run: |
          mkdir -p "data/jobs/$JOB"
          if [ "$STORE" = studio ]; then openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in job.pack | tar -C "data/jobs/$JOB" -xf -; else tar -C "data/jobs/$JOB" -xf job.pack; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/render/requirements.txt
      - name: Install Blender
        run: pip install -r app/render/requirements.txt
      - name: Install software drawing
        # Eevee (used by Blender files that bring their own look, and by the drawn styles) needs OpenGL; these machines have no graphics card
        run: sudo apt-get install -y -qq libegl1 libegl-mesa0 libgl1-mesa-dri > /dev/null 2>&1 || true
      - name: Render frames ${{ matrix.chunk.first }} to ${{ matrix.chunk.last }}
        run: |
          R=render_job.py; [ -f "data/jobs/$JOB/scene.blend" ] && R=render_blend.py
          python "app/render/$R" "data/jobs/$JOB" frames ${{ matrix.chunk.first }} ${{ matrix.chunk.last }} > render.log 2>&1 || { grep -vE "glTF|Blender create|EGL Error|^$" render.log | tail -25; exit 1; }
      - name: Pack the frames
        env:
          KEY: ${{ secrets.STUDIO_TOKEN }}
        run: |
          grep "rendered frame" render.log
          tar -C frames -cf frames.tar .
          if [ "$STORE" = studio ]; then openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -in frames.tar -out frames.pack; else mv frames.tar frames.pack; fi
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ env.JOB }}-${{ matrix.chunk.i }}
          path: frames.pack
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STORE == 'studio' && env.STUDIO_REPO || github.repository }}
          ref: ${{ env.STORE == 'studio' && 'main' || 'renders' }}
          token: ${{ env.STORE == 'studio' && secrets.STUDIO_TOKEN || github.token }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            jobs/${{ env.JOB }}/job.json
            out/README.md
            film/*/audio/
      - uses: actions/download-artifact@v4
        if: needs.render.result == 'success'
        with:
          pattern: frames-${{ env.JOB }}-*
          path: packs
      - name: Assemble the result
        env:
          RENDER_RESULT: ${{ needs.render.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KEY: ${{ secrets.STUDIO_TOKEN }}
        run: |
          OUT="out/$JOB"; mkdir -p "$OUT" frames
          read -r KIND F0 F1 FPS <<< "$(python3 -c "import json;j=json.load(open('jobs/$JOB/job.json'));print(j['kind'],j['frames'][0],j['frames'][1],j.get('fps',24))")"
          if [ "$RENDER_RESULT" != "success" ]; then
            printf '{"status":"failed","run":"%s"}\n' "$RUN_URL" > "$OUT/result.json"; exit 0
          fi
          for p in packs/*/frames.pack; do
            if [ "$STORE" = studio ]; then openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in "$p" | tar -C frames -xf -; else tar -C frames -xf "$p"; fi
          done
          if [ "$KIND" = "still" ]; then
            cp "frames/frame_$(printf %04d "$F0").png" "$OUT/render.png"
            FILE=render.png
          else
            command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
            # a film job names its spoken lines and when each starts: they are mixed in under the picture
            python3 - "jobs/$JOB/job.json" "$FPS" > mix.txt <<'PY'
          import json, os, sys
          job, fps = json.load(open(sys.argv[1])), float(sys.argv[2])
          a = job.get('audio') or {}
          cues = [(c, 'film/%s/audio/%s.mp3' % (a.get('film'), c.get('id') or '%03d' % c['n'])) for c in a.get('cues', [])]
          cues = [(c, p) for c, p in cues if os.path.exists(p)]
          secs = (job['frames'][1] - job['frames'][0] + 1) / fps
          fade = float(job.get('fade', 0) or 0)
          vf = 'scale=trunc(iw/2)*2:trunc(ih/2)*2,format=yuv420p' + (',fade=t=in:st=0:d=%.2f,fade=t=out:st=%.2f:d=%.2f' % (fade, max(0, secs - fade), fade) if fade else '')
          args = []
          if cues:
              for c, p in cues: args += ['-i', p]
              parts = ''.join('[%d:a]adelay=%d:all=1[a%d];' % (i + 1, round(c['t'] * 1000), i) for i, (c, p) in enumerate(cues))
              mix = parts + ''.join('[a%d]' % i for i in range(len(cues))) + 'amix=inputs=%d:normalize=0:dropout_transition=0,apad[a]' % len(cues)
              args += ['-filter_complex', '[0:v]%s[v];%s' % (vf, mix), '-map', '[v]', '-map', '[a]', '-c:a', 'aac', '-ac', '2', '-b:a', '160k', '-t', '%.3f' % secs]
          else:
              args += ['-vf', vf]
          print('\n'.join(args))
          PY
            mapfile -t MIX < mix.txt
            ffmpeg -nostdin -loglevel error -framerate "$FPS" -start_number "$F0" -i frames/frame_%04d.png "${MIX[@]}" \
              -c:v libx264 -preset slow -crf 22 -maxrate 3M -bufsize 6M -movflags +faststart "$OUT/shot.mp4"
            cp "frames/frame_$(printf %04d "$F0").png" "$OUT/poster.png"
            FILE=shot.mp4
          fi
          printf '{"status":"done","file":"%s","frames":%d,"run":"%s"}\n' "$FILE" "$((F1 - F0 + 1))" "$RUN_URL" > "$OUT/result.json"
      - name: Commit the result
        run: |
          git config user.name "rigroom-render"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse "out/$JOB"
          git diff --cached --quiet && { echo "Nothing new to commit"; exit 0; }
          git commit -q -m "Render $JOB"
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          for try in 1 2 3 4; do
            git pull -q --rebase origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && exit 0
            sleep $((try * 5))
          done
          exit 1
